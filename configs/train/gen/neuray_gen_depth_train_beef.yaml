name: neuray_gen_depth_train_beef

# add hyper structure
use_hyper: true
use_opo: true

# network
network: neuray_gen
init_net_type: depth
use_hierarchical_sampling: false
use_depth_loss: true
dist_decoder_cfg:
  use_vis: false
fine_dist_decoder_cfg:
  use_vis: false
ray_batch_num: 8192
agg_net_type: 4mixlinear
# loss
loss: [render, depth]
val_metric: [psnr_ssim, vis_img]
key_metric_name: psnr_nr
use_dr_loss: false
use_dr_fine_loss: false
use_nr_fine_loss: false
# use_nr_fine_loss: true

# lr
total_step: 100000
val_interval: 4000
lr_type: exp_decay
lr_cfg:
  lr_init: 4.0e-4
  decay_step: 10000
  decay_rate: 0.5

train_views_for_valid: -1
# dataset
train_dataset_type: gen
train_dataset_cfg:
  resolution_type: hr
  type2sample_weights: {example: 100}
  train_database_types: ['example']
  example_scene_names: ['example/beef_0']
  aug_pixel_center_sample: true
  train_views: 5
  val_database_split_type: example_
  ref_pad_interval: 32
  use_src_imgs: true

val_set_list:
  -
    name: example
    type: gen
    cfg:
      val_database_name: example/beef_0
